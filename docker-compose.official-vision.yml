services:
  vllm-dspark:
    image: ${OFFICIAL_VISION_IMAGE:-local/deepseek-v4-flash-vision:vllm-5ab628dd1-fi-26fabfe-gb10}
    pull_policy: never
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: "64gb"
    restart: ${DSPARK_RESTART_POLICY:-no}
    stop_grace_period: 10s

    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$HEADLESS\" ]; then exit 0; fi; curl -fsS http://127.0.0.1:${VLLM_PORT:-8888}/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
      - ${DSPARK_TMP_HOST:-${HOME}/.cache/dspark-tmp}:/tmp

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      DSPARK_MODEL_OFFICIAL: "${DSPARK_MODEL_OFFICIAL:-deepseek-ai/DeepSeek-V4-Flash-Vision-Exp}"
      DSPARK_REVISION: "${DSPARK_REVISION:?DSPARK_REVISION must be set to the pinned model commit}"
      VLLM_HOST_IP: "${VLLM_HOST_IP}"
      NCCL_IB_DISABLE: "0"
      NCCL_NET: IB
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-3}"
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_IB_MERGE_NICS: "${NCCL_IB_MERGE_NICS:-1}"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_NVLS_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME}"
      TORCH_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      # GB10 crossover autotuning can route graph-stable row-strided C128A
      # metadata through a prefill kernel that requires dense rows.
      FLASHINFER_WORKSPACE_BASE: /cache/huggingface/flashinfer-official-4802-gb10-stable
      VLLM_FLASHINFER_AUTOTUNE_SKIP_OPS: trtllm_fp4_block_scale_moe,flashinfer::trtllm_fp4_block_scale_moe
      VLLM_USE_BREAKABLE_CUDAGRAPH: "${VLLM_USE_BREAKABLE_CUDAGRAPH:-0}"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      HEADLESS: "${HEADLESS:-}"

    command:
      - bash
      - -lc
      - >
        API_KEY_ARGS=();
        if [ -n "$${VLLM_API_KEY:-}" ]; then API_KEY_ARGS=(--api-key "$${VLLM_API_KEY}"); fi;
        SPECULATIVE_CONFIG=$$(printf '{"method":"dspark","model":"%s","revision":"%s","num_speculative_tokens":%s,"draft_sample_method":"probabilistic","enable_adaptive_verification":false}' "$${DSPARK_MODEL_OFFICIAL}" "$${DSPARK_REVISION}" "${OFFICIAL_MTP_NUM_TOKENS:-3}");
        exec vllm serve "$${DSPARK_MODEL_OFFICIAL}"
        --revision "$${DSPARK_REVISION}"
        --served-model-name "${SERVED_MODEL_NAME:-deepseek-v4-flash-vision-exp}"
        --host "${VLLM_HOST:-0.0.0.0}"
        --port "${VLLM_PORT:-8888}"
        "$${API_KEY_ARGS[@]}"
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --enable-expert-parallel
        --kv-cache-dtype fp8
        --block-size 256
        --max-model-len "${OFFICIAL_MAX_MODEL_LEN:-1048576}"
        --max-num-seqs 1
        --max-num-batched-tokens "${MAX_NUM_BATCHED_TOKENS:-8192}"
        --long-prefill-token-threshold "${LONG_PREFILL_TOKEN_THRESHOLD:-1024}"
        --max-cudagraph-capture-size 4
        --gpu-memory-utilization "${OFFICIAL_GPU_MEMORY_UTILIZATION:-0.90}"
        --enable-prefix-caching
        --enable-prompt-tokens-details
        --async-scheduling
        --enable-chunked-prefill
        --speculative-config "$${SPECULATIVE_CONFIG}"
        --tokenizer-mode deepseek_v4
        --limit-mm-per-prompt '{"image":8,"video":0}'
        --distributed-executor-backend mp
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        --default-chat-template-kwargs '{"thinking":true,"reasoning_effort":"high"}'
        --generation-config vllm
        --no-enable-flashinfer-autotune
        --nnodes 2
        --node-rank "${NODE_RANK}"
        --master-addr "${MASTER_ADDR}"
        --master-port "${MASTER_PORT:-25000}"
        ${HEADLESS:+--headless}
